<div class="error-container">
  <mat-card class="error-card">
    <mat-card-header class="error-header">
      <div>
        <h3>{{ 'ERROR.OOPS' | translate }}</h3>
        <h5 class="text-muted">{{ 'ERROR.UNEXPECTED_ERROR' | translate }}</h5>
      </div>
    </mat-card-header>
    <mat-card-content>
      <mat-icon class="error-icon">error_outline</mat-icon>
      <div class="error-content">
        <h6>{{ 'ERROR.ERROR_DETAILS' | translate }}:</h6>
        <p>{{ errorMessage }}</p>
      </div>
    </mat-card-content>
    <mat-card-actions align="end">
      <button mat-button color="primary" routerLink="/">
        {{ 'ERROR.GO_TO_HOME' | translate }}
      </button>
    </mat-card-actions>
  </mat-card>
</div>
