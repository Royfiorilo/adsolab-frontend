<ng-container>
  <div class="main-header d-flex justify-content-between align-items-center">
    <div class="pt-0 pb-0 p-5 text-white adsolab" style="cursor: pointer"
         routerLink="/">{{ 'ADSOLAB_TITLE' | translate }}
    </div>

    <div *ngIf="authService.isAuth()" class="m-5">
      <div class="text-white">
        <mat-icon>person</mat-icon>
        {{ authService.getAuthUserInfo()?.email }}
      </div>
      <button mat-button (click)="logout()" class="text-white">
        <mat-icon>logout</mat-icon>
        {{ 'LOGIN.LOGOUT' | translate }}
      </button>
    </div>


    <div class="pt-0 pb-0 p-5">
      <img class="img-fluid image-adsolab" src="assets/logo_front.png" alt="Fiuba Logo">
    </div>
  </div>
</ng-container>
