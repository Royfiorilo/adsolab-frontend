<div class="navigation-container">

  <div class="main-header d-flex align-items-center">
    <div class="container-fluid">
      <div class="row align-items-center">
        <div class="col-md-6 col-sm-6 mb-2 mb-sm-0 text-center text-sm-start">
          <div class="text-white adsolab" style="cursor: pointer" routerLink="/">
            {{ 'ADSOLAB_TITLE' | translate }}
          </div>
        </div>

        <div class="col-md-6 col-sm-6 text-center text-md-end">
          <img class="image-adsolab" src="assets/logo_front.png" alt="Fiuba Logo">
        </div>
      </div>
    </div>
  </div>

  <mat-sidenav-container class="sidenav-container">

    <mat-sidenav #snav [mode]="'over'" [autoFocus]="false">
      <div class="sidenav-content">
        <mat-nav-list>
          <a mat-list-item routerLink="/investigation"
             (click)="snav.toggle()">{{ 'MAIN_PAGE.NEW_INVESTIGATION' | translate }}</a>
          <a mat-list-item routerLink="/historic" (click)="snav.toggle()">{{ 'MAIN_PAGE.HIST' | translate }}</a>
          <a *ngIf="isAdmin()" mat-list-item routerLink="/users"
             (click)="snav.toggle()">{{ 'MAIN_PAGE.USERS' | translate }}</a>
        </mat-nav-list>
        <div class="sidenav-footer" *ngIf="authService.isAuth()">
          <div>
            <mat-icon>person</mat-icon>
            {{ authService.getAuthUserInfo()?.email }}
          </div>
          <button mat-button (click)="openEditUserDialog()">
            <mat-icon>edit</mat-icon>
            {{ 'EDIT' | translate }}
          </button>
          <button mat-button color="accent" (click)="logout()">
            <mat-icon>logout</mat-icon>
            {{ 'LOGIN.LOGOUT' | translate }}
          </button>
        </div>
      </div>
    </mat-sidenav>

    <mat-sidenav-content>
      <router-outlet></router-outlet>
    </mat-sidenav-content>

  </mat-sidenav-container>

</div>
