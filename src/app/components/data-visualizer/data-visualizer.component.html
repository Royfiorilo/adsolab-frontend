<div class="m-2">
  <div class="d-flex justify-content-center">
    <button mat-button color="primary" class="m-3" (click)="this.isTableVisible = !this.isTableVisible">
      {{ 'DATA_VISUALIZER.SHOW_OR_HIDE_SAMPLE' | translate }}
    </button>
  </div>

  <div *ngIf="this.isTableVisible && data">
    <div class="card">
      <div class="card-body">
        <h6 class="card-title text-center">{{ data.title }}</h6>
        <table class="table table-striped">
          <thead>
          <tr>
            <th scope="col">#</th>
            <th scope="col">Ce</th>
            <th scope="col">Qe</th>
          </tr>
          </thead>
          <tbody>
          <tr *ngFor="let ceValue of data.ce; let i = index">
            <th scope="row">{{ i + 1 }}</th>
            <td>{{ ceValue }}</td>
            <td>{{ data.qe[i] }}</td>
          </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
