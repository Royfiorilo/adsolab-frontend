<div class="container-fluid">
  <h3 class="mt-3 ms-5">
    Usuarios
  </h3>
  <div class="row w-75 mx-auto m-2">
    <div class="col">
      <div class="text-end">
        <button mat-button color="primary">
          <mat-icon matPrefix>add</mat-icon>
          Crear nuevo
        </button>
      </div>
    </div>
  </div>
  <div class="row w-75 mx-auto">
    <div class="col">
      <div class="text-center">
        <table mat-table [dataSource]="dataSource" class="mat-elevation-z8">
          <ng-container matColumnDef="id">
            <th mat-header-cell *matHeaderCellDef> ID</th>
            <td mat-cell *matCellDef="let user"> {{ user.id }}</td>
          </ng-container>

          <ng-container matColumnDef="email">
            <th mat-header-cell *matHeaderCellDef> Email</th>
            <td mat-cell *matCellDef="let user"> {{ user.email }}</td>
          </ng-container>

          <ng-container matColumnDef="roles">
            <th mat-header-cell *matHeaderCellDef> Roles</th>
            <td mat-cell *matCellDef="let user"> {{ user.roles.join(', ') }}</td>
          </ng-container>

          <ng-container matColumnDef="active">
            <th mat-header-cell *matHeaderCellDef> Activo</th>
            <td mat-cell *matCellDef="let user"> {{ user.active ? 'Si' : 'No' }}</td>
          </ng-container>

          <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef class="text-center"> Acciones</th>
            <td mat-cell *matCellDef="let user" class="text-center">
              <button mat-button class="text-muted" [routerLink]="['/users', user.id]">
                <mat-icon matPrefix>edit</mat-icon>
                Editar
              </button>
              <button mat-button color="warn" (click)="openDeleteUserDialog(user.id, user.email)">
                <mat-icon matPrefix>delete</mat-icon>
                Borrar
              </button>
            </td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        </table>
      </div>
    </div>
  </div>
</div>

<ng-template let-data #deleteUserDialog>
  <h2 mat-dialog-title>
    Borrar usuario
  </h2>
  <mat-dialog-content class="mat-typography">
    <p>
      ¿Seguro que desea eliminar a {{ data.email }}?
    </p>
  </mat-dialog-content>
  <mat-dialog-actions align="end">
    <button mat-button color="primary" mat-dialog-close>
      Cancelar
    </button>
    <button mat-flat-button color="warn" class="text-white" [mat-dialog-close]="true"
            (click)="deleteUser(data.userId)">
      Confirmar
    </button>
  </mat-dialog-actions>
</ng-template>

<app-loading *ngIf="loadingUsers"></app-loading>
