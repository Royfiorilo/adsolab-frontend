<div class="container-fluid" *ngIf="!loadingUsers">

  <div class="row w-75 mx-auto m-2">
    <h3 class="mt-3">
      Usuarios
    </h3>
    <div class="col">
      <div class="text-end">
        <button mat-button color="primary" (click)="openCreateUserDialog()">
          <mat-icon matPrefix>add</mat-icon>
          Crear nuevo
        </button>
      </div>
    </div>
  </div>
  <div class="row w-75 mx-auto">
    <div class="col">
      <div class="text-center">
        <table mat-table [dataSource]="dataSource" class="mat-elevation-z8">
          <ng-container matColumnDef="id">
            <th mat-header-cell *matHeaderCellDef class="table-header"> ID</th>
            <td mat-cell *matCellDef="let user"> {{ user.id }}</td>
          </ng-container>

          <ng-container matColumnDef="email">
            <th mat-header-cell *matHeaderCellDef class="table-header"> Email</th>
            <td mat-cell *matCellDef="let user"> {{ user.email }}</td>
          </ng-container>

          <ng-container matColumnDef="roles">
            <th mat-header-cell *matHeaderCellDef class="table-header"> Rol</th>
            <td mat-cell *matCellDef="let user"> {{ parseUserRole(user.roles) }}</td>
          </ng-container>

          <ng-container matColumnDef="active">
            <th mat-header-cell *matHeaderCellDef class="table-header"> Activo</th>
            <td mat-cell *matCellDef="let user"> {{ user.active ? 'Si' : 'No' }}</td>
          </ng-container>

          <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef class="table-header text-center"> Acciones</th>
            <td mat-cell *matCellDef="let user" class="text-center">
              <button mat-icon-button class="text-muted" (click)="openEditUserDialog(user)">
                <mat-icon>edit</mat-icon>
              </button>
              <button mat-icon-button color="warn" (click)="openDeleteUserDialog(user.id, user.email)">
                <mat-icon>delete</mat-icon>
              </button>
            </td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        </table>
      </div>
    </div>
  </div>
</div>

<ng-template let-data #deleteUserDialog>
  <h2 mat-dialog-title>
    Borrar usuario
  </h2>
  <mat-dialog-content class="mat-typography">
    <p>
      ¿Seguro que desea eliminar a {{ data.email }}?
    </p>
  </mat-dialog-content>
  <mat-dialog-actions align="end">
    <button mat-button color="primary" mat-dialog-close>
      Cancelar
    </button>
    <button mat-flat-button color="warn" class="text-white" [mat-dialog-close]="true"
            (click)="deleteUser(data.userId)">
      Confirmar
    </button>
  </mat-dialog-actions>
</ng-template>

<app-loading *ngIf="loadingUsers"></app-loading>
