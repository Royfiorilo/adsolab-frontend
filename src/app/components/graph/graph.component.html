<div *ngIf="qe.length>0; else loading">
  <plotly-plot [data]="graph.data" [layout]="graph.layout"
               [config]="{responsive: true}">
  </plotly-plot>
</div>
<ng-template #loading>
  <div class="d-flex justify-content-center">
    <div class="spinner-border" role="status"></div>
  </div>
</ng-template>
