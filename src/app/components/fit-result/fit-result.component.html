<div class="container-fluid p-3">
  <div class="row">
    <div class="col">
      <div class="row">
        <div class="col">
          <h5 class="text-muted">{{ 'MODEL_COMPARE.PARAMS' | translate }}</h5>
        </div>
      </div>
      <div class="row row-cols-1 row-cols-md-3 row-cols-lg-4 g-3">
        <div class="col" *ngFor="let param of parameters">
          <div>
            <span class="fiuba-institutional-text">{{ param.name }}</span>
            <span class="text-muted text-body-emphasis">
              <h5>{{ param.value }} <small class="text-muted">± {{ param.std_err }}</small></h5>
            </span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <mat-divider class="my-3"></mat-divider>

  <div class="row">
    <div class="col-12 mb-2">
      <h5 class="text-muted">{{ 'MODEL_COMPARE.STATISTICS' | translate }}</h5>
    </div>
  </div>

  <div class="row row-cols-1 row-cols-md-2 row-cols-lg-4 g-3">
    <div class="col" *ngFor="let statistic of getStatisticsInOrder()">
      <div>
        <span class="card-title text-muted">{{ 'STATISTICS.' + statistic[0] | translate }}</span>
        <h5 class="mt-1">{{ statistic[1] }}</h5>
      </div>
    </div>
  </div>
</div>
