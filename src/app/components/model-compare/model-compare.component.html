<div class="container-fluid m-3">
  <div class="row justify-content-center">
    <app-data-visualizer *ngIf="this.dataSample" [data]="this.dataSample"></app-data-visualizer>

    <div *ngFor="let modelId of selectedModels" class="col-6">
      <div class="card">
        <div class="card-body d-flex flex-column">
          <div class="d-flex justify-content-between align-items-center">
            <h5
              class="card-title mb-0 flex-grow-1 text-center">{{ commonUtilsService.getModelById(modelId, models).name }}</h5>
          </div>
          <p class="card-text mt-2"></p>

          <div *ngFor="let item of noLinearResults[modelId]">
            <hr>
            <div *ngIf="item.best" class="mt-3 alert alert-success" role="alert">
              Best model: {{ item.adjustment_name }}
            </div>
            <plotly-plot [data]="item.graph.data" [layout]="item.graph.layout"></plotly-plot>

            <div class="table-responsive">
              <table class="table table-bordered table-striped border-primary">
                <thead>
                <tr>
                  <th scope="col">#</th>
                  <th *ngFor="let param of item.parameters" scope="col">{{ param.name }}</th>
                  <th scope="col">r</th>
                  <th scope="col">std err</th>
                  <th scope="col">Chi squared</th>
                </tr>
                </thead>
                <tbody>
                <tr>
                  <th scope="row">1</th>
                  <td *ngFor="let param of item.parameters">{{ param.value }}</td>
                  <td> {{ item.statistics.r }}</td>
                  <td> {{ item.statistics.stderr }}</td>
                  <td> {{ item.statistics.Chi_squared }}</td>

                </tr>
                </tbody>
              </table>

            </div>
          </div>

        </div>
      </div>
    </div>
  </div>

</div>
