<div class="container-fluid m-2">
  <div class="row d-flex justify-content-center">
    <div class="col-10">
      <mat-stepper [linear]="true">
        <mat-step label="Datos" [completed]="investigationId">
          <app-data-selector (onDataSampleUploaded)="investigationCreated($event)"></app-data-selector>
          <div class="float-end" *ngIf="investigationId">
            <button mat-button matStepperNext mat-raised-button class="fiuba-institutional-bg text-white">
              Continuar
            </button>
          </div>
        </mat-step>
        <mat-step label="Selección de Modelos" [completed]="selectedModels.length !== 0">
          <ng-template matStepContent>
            <app-model-selector [models]="models" [selectedModels]="selectedModels"
                                (onLoadedModels)="onLoadedModels($event)"
                                (onSelectedModels)="onModelSelected($event)"></app-model-selector>

            <div class="float-start" *ngIf="models.length !== 0">
              <button mat-button matStepperPrevious mat-stroked-button
                      class="fiuba-institutional-border fiuba-institutional-text">
                Volver
              </button>
            </div>
            <div class="float-end" *ngIf="selectedModels.length !== 0">
              <button mat-button matStepperNext mat-raised-button class="fiuba-institutional-bg text-white">
                Continuar
              </button>
            </div>
          </ng-template>
        </mat-step>
        <mat-step label="Configuración de Modelos" [completed]="false">
          <ng-template matStepContent>
            <app-model-configuration [investigationId]="investigationId" [models]="models"
                                     [modelConfiguration]="modelConfiguration"
                                     (onSelectedConfiguration)="onSelectedConfiguration($event)"
                                     [selectedModels]="selectedModels"></app-model-configuration>
            <div class="float-start">
              <button mat-button matStepperPrevious mat-stroked-button
                      class="fiuba-institutional-border fiuba-institutional-text">
                Volver
              </button>
            </div>
            <!--      TODO: ver logica para avanzar en este step-->
          </ng-template>
        </mat-step>
        <mat-step label="Resultados">
          <ng-template matStepContent>
            <app-model-compare [selectedModels]="selectedModels"></app-model-compare>
            <div class="float-start">
              <button mat-button matStepperPrevious mat-stroked-button
                      class="fiuba-institutional-border fiuba-institutional-text">
                Volver
              </button>
            </div>
          </ng-template>
        </mat-step>
      </mat-stepper>
    </div>
  </div>
</div>
