<div class="row d-flex align-content-center justify-content-center">
  <div class="col-6">
    <div class="card mt-3 mb-3">
      <div class="card-body ">
        <app-file-upload (onDataSampleUploaded)="setUploadDataSample($event)"></app-file-upload>
      </div>

      <ng-container *ngIf="dataSample">
        <div class="mt-auto d-flex justify-content-center align-content-center ">
          <button class="btn fiuba-institutional m-3"
                  (click)="createInvestigation()">{{ 'DATA_SELECTOR.START_INVESTIGATION' | translate }}
          </button>
        </div>
      </ng-container>

      <ng-container *ngIf="options.length">
        <div class="m-3">
          <mat-form-field style="width: 100%">
            <input matInput
                   placeholder="Buscar muestra por nombre"
                   [formControl]="inputControl"
                   [matAutocomplete]="auto">

            <mat-autocomplete #auto="matAutocomplete" (optionSelected)="onOptionSelected($event)">
              <mat-option *ngFor="let option of filteredOptions | async" [value]="option">
                {{ option }}
              </mat-option>
            </mat-autocomplete>
          </mat-form-field>
        </div>


      </ng-container>
    </div>
    <app-data-visualizer *ngIf="dataSample" [data]="dataSample"></app-data-visualizer>
  </div>
</div>
<ng-container *ngIf="loadingDataSample">
  <app-loading></app-loading>
</ng-container>
