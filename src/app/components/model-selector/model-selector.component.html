<div class="container-fluid d-flex justify-content-between m-3">
  <div *ngFor="let model of models" class="card m-3">
    <div class="card-body">
      <div class="d-flex justify-content-between align-items-center">
        <fa-icon (click)="open(content)" [icon]="faInfoCircle"></fa-icon>
        <h5 class="card-title mb-0 flex-grow-1 text-center">{{ model.name }}</h5>
        <input class="form-check-input" type="checkbox" [checked]="selectedModels.includes(model.name)" (change)="selectModel(model.name)">
      </div>
    </div>

    <ng-template #content let-modal>
      <div class="modal-header">
        <h4 class="modal-title" id="modal-basic-title">Detalles del modelo</h4>
        <button type="button" class="btn-close" aria-label="Close" (click)="modal.dismiss('Cross click')"></button>
      </div>
      <div class="modal-body">
        <div class="mb-3">
          <div class="input-group">
            {{model.description}}
          </div>
        </div>
      </div>
    </ng-template>
  </div>
</div>
