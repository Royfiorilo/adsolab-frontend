<div class="container-fluid">
  <div class="row d-flex justify-content-center m-3">
    <div *ngFor="let model of models" class="col-4">

      <mat-card
        class="model-card"
        [class.selected]="selectedModels.includes(model._id)"
        (click)="selectModel(model._id)"
        matRipple>

        <mat-card-content class="card-content">
          <div class="row">
            <div class="col">
              <small class="float-start text-muted" style="font-size: 10px">
                <mat-icon matTooltip="{{ 'MODEL_SELECTOR.MODEL_DETAILS' | translate }}"
                          (click)="open(content); $event.stopPropagation()">info
                </mat-icon>
              </small>
              <div class="float-end">
                <mat-icon class="selection-icon">
                  {{selectedModels.includes(model._id) ? 'check_circle' : 'radio_button_unchecked'}}
                </mat-icon>
              </div>
            </div>
          </div>
          <div class="row">
            <div class="col">
              <h2 class="model-title">
                {{model.name}}
              </h2>
            </div>
          </div>
          <div class="row">
            <div class="col">
              <p class="model-description">{{model.formula}}</p>
            </div>
          </div>


        </mat-card-content>

        <ng-template #content let-modal>
          <div class="modal-header">
            <h4 class="modal-title" id="modal-basic-title">{{ 'MODEL_SELECTOR.MODEL_DETAILS' | translate }}</h4>
            <button type="button" class="btn-close" aria-label="Close"
                    (click)="modal.dismiss('Cross click')"></button>
          </div>
          <div class="modal-body">
            <div class="mb-3">
              <div class="input-group">
                {{ model.description }}
              </div>
              <div class="input-group">
                {{ model.formula }}
              </div>
            </div>
          </div>
        </ng-template>
      </mat-card>

    </div>
  </div>
</div>


<ng-container *ngIf="loadingModels">
  <app-loading></app-loading>
</ng-container>
