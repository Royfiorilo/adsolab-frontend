<div class="container-fluid">
  <div class="row d-flex justify-content-center">
    <div *ngFor="let model of models" class="col-3">
      <div class="card m-3">
        <div
          class="card-body p-3 shadow-sm d-flex flex-column align-items-center text-center"
          [ngClass]="{'selected-card': selectedModels.includes(model._id)}"
          (click)="selectModel(model._id)">
          <h5 class="card-title mb-2">{{ model.name }}</h5>
          <fa-icon (click)="open(content); $event.stopPropagation()" [icon]="faInfoCircle" class="text-muted mb-3"
                   style="cursor: pointer; font-size: 1.5rem;"></fa-icon>
        </div>


        <ng-template #content let-modal>
          <div class="modal-header">
            <h4 class="modal-title" id="modal-basic-title">{{ 'MODEL_SELECTOR.MODEL_DETAILS' | translate }}</h4>
            <button type="button" class="btn-close" aria-label="Close"
                    (click)="modal.dismiss('Cross click')"></button>
          </div>
          <div class="modal-body">
            <div class="mb-3">
              <div class="input-group">
                {{ model.description }}
              </div>
              <div class="input-group">
                {{ model.formula }}
              </div>
            </div>
          </div>
        </ng-template>
      </div>
    </div>
  </div>
</div>
<ng-container *ngIf="loadingModels">
  <app-loading></app-loading>
</ng-container>
